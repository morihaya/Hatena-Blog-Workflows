name: check article format

on:
  pull_request:
    paths:
      - "content/entry/**/*.md"
      - "scripts/check_article_format.py"
      - ".github/workflows/check-article-format.yaml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check newly added articles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -d '' articles < <(
            git diff --diff-filter=A --name-only -z \
              "$BASE_SHA" "$HEAD_SHA" -- 'content/entry/**/*.md'
          )
          python3 scripts/check_article_format.py "${articles[@]}"
