name: Check Draft Status

on:
  pull_request:
    branches:
      - main
    paths:
      - 'draft_entries/**/*.md'

jobs:
  check-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Check for Draft: true in draft_entries"
        run: |
          echo "Checking for 'Draft: true' in draft_entries/*.md files..."

          # Find all .md files in draft_entries that contain "Draft: true"
          DRAFT_FILES=$(grep -rl "Draft: true" draft_entries/*.md 2>/dev/null || true)

          if [ -n "$DRAFT_FILES" ]; then
            echo "❌ Error: The following files still have 'Draft: true' and cannot be merged to main:"
            echo ""
            for file in $DRAFT_FILES; do
              echo "  - $file"
            done
            echo ""
            echo "Please remove 'Draft: true' from these files before merging."
            exit 1
          else
            echo "✅ All draft_entries files are ready to be merged (no 'Draft: true' found)."
          fi
